name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Same runner for every job — no self-hosted runner required.
# Cancels in-progress runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and unit tests across the monorepo. Catches regressions
  # before they reach Cloud Run / Cloud Functions / Hosting.
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          # Firestore emulator requires Java 21+. The default
          # runner has an older JDK; install Temurin 21.
          distribution: temurin
          java-version: '21'

      - name: Install workspaces
        run: npm install

      - name: Build @worktracker/types
        # The web and api both depend on the published types, so
        # build it first so the .d.ts files are present.
        run: npm run build --workspace=@worktracker/types

      - name: Typecheck
        run: npm run typecheck

      - name: API tests (Firestore emulator)
        # The brain test exercises the full command-queue → brain
        # → work-item pipeline against the Firestore emulator. The
        # emulator must be running before `npm test` kicks off.
        run: |
          # `npm install --no-save firebase-tools` puts the binary
          # in node_modules/.bin/, which isn't on PATH in the
          # default shell. Use npx to invoke it.
          npm install --no-save firebase-tools
          npx firebase emulators:exec --only firestore \
            --project worktracker-test \
            "npm --workspace=@worktracker/api test"

  # Static check that the Next.js web build still produces a
  # working static export. Catches broken imports / wrong
  # router config without deploying to Hosting.
  build-web:
    name: build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run build --workspace=@worktracker/types
      - run: npm run build --workspace=@worktracker/web

  # Build the API image so we catch Dockerfile / build-tool issues
  # before they reach `gcloud run deploy`. The Cloud Build that
  # `gcloud run deploy --source .` invokes does the same work, but
  # running it locally in CI gives a faster signal and doesn't
  # consume Cloud Build minutes.
  build-api-image:
    name: build api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: docker/setup-buildx-action@v3
      - run: npm install
      - name: Build Cloud Run container
        # The Dockerfile lives at apps/api/Dockerfile but the
        # build context is the repo root (it copies
        # packages/types, tsconfig.base.json, etc.). Run from
        # the repo root and pass -f to point at the Dockerfile.
        run: |
          docker buildx build \
            --tag worktracker-api:ci \
            --load \
            -f apps/api/Dockerfile \
            .

  # Smoke test the live stack. Runs on push to master only (not
  # on PRs) so an in-flight feature branch can't accidentally
  # pollute the production database. The script self-cleans its
  # own work_items and command docs, so prod stays tidy.
  #
  # Requires two secrets to be configured in the repo:
  #   SMOKE_API_BASE   default https://worktracker-nyx.web.app
  #   SMOKE_ADMIN_TOKEN default worktracker-prod-2026-admin-token
  #   GCP_SA_KEY       service account with Firestore read+write,
  #                     only used for the dead-letter admin
  #                     section (the rest of the script is
  #                     pure REST against the API).
  smoke:
    name: live smoke
    runs-on: ubuntu-latest
    needs: [check, build-web, build-api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end smoke
        env:
          API_BASE: ${{ secrets.SMOKE_API_BASE }}
          ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
          # Decode the base64 service-account key for gcloud.
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          ./scripts/smoke.sh
